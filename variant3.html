<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вариант 3 · подробно</title>
<style>
  body { margin: 0; background: #e6ebf0; color: #1b1b1b; font: 12px/1.25 system-ui, sans-serif; }
  a { color: #1a4fbf; }
  button { font: inherit; padding: 3px 10px; border: 1px solid #888; background: #fff; cursor: pointer; }
  button.on { background: #222; color: #fff; }
  .ok { background: #d7f2d7; color: #145214; border-radius: 4px; padding: 2px 8px; font-weight: 700; }
  svg { width: 100%; height: calc(100vh - 46px); background: #e8eef3; }
  .panel { fill: none; stroke: #b7c0ca; stroke-dasharray: 5 4; }
  .card { fill: #fffef9; stroke: #e0a030; stroke-width: 1.6; }
  .inv { fill: #fff4d2; stroke: #e0a030; stroke-width: 1.6; }
  .dot { fill: #fff; stroke: #c98920; stroke-width: 1.4; }
  .t { font-size: 13px; font-weight: 700; fill: #222; }
  .s { font-size: 11px; fill: #444; }
  .n { font-size: 12px; fill: #333; }
  .w { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; }
  .run:hover .w { stroke-width: 5; filter: drop-shadow(0 0 2px #fff); }
  .grid-L { stroke: #9a5a22; } .grid-N { stroke: #2a62d6; }
  .load-L { stroke: #ef8a00; } .load-N { stroke: #3eb4e8; }
  .dead { stroke: #c5cad1; }
  .pe { stroke: #1f8f32; }
  .barN { stroke: none; } .barN.grid-N { fill: #2a62d6; } .barN.load-N { fill: #3eb4e8; } .barN.dead { fill: #c5cad1; }
  .pebar { stroke: none; fill: url(#pe); }
  .pill { fill: #fff; stroke: #8a93a0; }
  .lev { cursor: pointer; }
</style>
</head>
<body>
<link rel="stylesheet" href="scheme/nav.css">
<header class="site">
  <nav id="views"></nav>
  <script src="scheme/nav.js"></script>
  <span>Переключатель Кладовка
    <button data-g="storage" data-v="0">0</button><button data-g="storage" data-v="1">I</button><button data-g="storage" data-v="2">II</button>
  </span>
  <span>Переключатель Квартира
    <button data-g="apartment" data-v="0">0</button><button data-g="apartment" data-v="1">I</button><button data-g="apartment" data-v="2">II</button>
  </span>
  <span id="badge" class="ok"></span>
  <span id="status"></span>
</header>
<svg id="svg" viewBox="0 0 1720 1180">
  <defs>
    <pattern id="pe" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f2d600"/>
      <rect width="4" height="8" fill="#1f8f32"/>
    </pattern>
  </defs>
</svg>
<script type="module">
import { devices, energize, gateBreakers, selfCheck } from './scheme/circuit.js'
import { applyHops } from './scheme/hop.js'

const pos = { storage: 1, apartment: 1 }
const sw = {}
const svg = document.getElementById('svg')
const wires = []
const d = devices()
const on = (id) => sw[id] !== false
const live = (via) => !via || via.every(on)

function box(x, y, w, h, title, sub, id) {
  return { x, y, w, h, title, sub, id, p: {} }
}
function port(b, id, x, y, label) { b.p[id] = { x, y, label } }
function add(pts, kind, pole, g, via) {
  wires.push({ pts, kind, pole, g: g ?? 's' + wires.length, via })
}
const PS = 16 // зазор L/N на параллельных трассах
function go(a, b, y, kind, pole, g, via) {
  const yy = y + pole * PS
  add([a, { x: a.x, y: yy }, { x: b.x, y: yy }, b], kind, pole, g, via)
}

const Y = 36, H = 140
const city = box(16, Y, 102, H, 'Ввод 40 А', 'MC240A · 3×10', 'city')
const zA = box(134, Y, 112, H, 'ЗУБР', 'MF2-63 red', 'zA')
const sA = box(262, Y, 152, H, 'Переключатель I-0-II', 'квартира')
const pzv = box(430, Y, 112, H, 'Диф 63 А', 'CDA263D', 'pzv')
const gapR1R2 = 40
const gapR2Sto = 80 // вдвое больше сдвига, чем между рейками
const sY = 496 + gapR1R2 + gapR2Sto
const qIn = box(16, sY, 102, H, 'Ввод 32 А', 'MC232A', 'qIn')
const zS = box(134, sY, 112, H, 'ЗУБР', 'MF2-63 red', 'zS')
const qG = box(262, sY, 102, H, 'На Grid', 'MC232A', 'qG')
const qL = box(380, sY, 102, H, 'С Load', 'MC232A', 'qL')
const sS = box(498, sY, 152, H, 'Переключатель I-0-II', 'кладовка')

function topBottom(b, inL, inN, outL, outN) {
  port(b, 'inL', b.x + 18, b.y, inL)
  port(b, 'inN', b.x + b.w - 18, b.y, inN)
  port(b, 'outL', b.x + 18, b.y + b.h, outL)
  port(b, 'outN', b.x + b.w - 18, b.y + b.h, outN)
}
topBottom(city, 'L', 'N', 'L', 'N')
topBottom(zA, '1', '2', '3', '4')
topBottom(zS, '1', '2', '3', '4')
topBottom(qIn, 'L', 'N', 'L', 'N')
topBottom(qG, 'L', 'N', 'L', 'N')
topBottom(qL, 'L', 'N', 'L', 'N')
topBottom(pzv, 'L', 'N', 'L', 'N')
function sftPorts(b) {
  port(b, 'oL', b.x + 28, b.y, '1')
  port(b, 'oN', b.x + b.w - 28, b.y, '5')
  port(b, 'iL', b.x + 22, b.y + b.h, '2')
  port(b, 'iN', b.x + 48, b.y + b.h, '6')
  port(b, 'iiL', b.x + b.w - 48, b.y + b.h, '4')
  port(b, 'iiN', b.x + b.w - 22, b.y + b.h, '8')
}
;[sA, sS].forEach(sftPorts)

const heavy = d.apartmentRail1.slice(4)
const spare = d.apartmentRail2.slice(2)
const heavyBoxes = heavy.map((item, i) => {
  const b = box(560 + i * 114, Y, 110, H, item.name, item.part + (item.ferrule ? ' · ' + item.ferrule : ''), 'h' + i)
  port(b, 'L', b.x + b.w / 2, b.y, String(i + 1))
  port(b, 'N', b.x + b.w / 2, b.y + b.h, 'N')
  return b
})
const r2Y = 284 + gapR1R2
const R2H = 124
const q2 = box(16, r2Y, 112, R2H, 'Ввод рейки 2', 'MC232A', 'q2')
const dif2 = box(146, r2Y, 112, R2H, 'Диф 32 А', 'ADA982D', 'dif2')
topBottom(q2, 'L', 'N', 'L', 'N')
topBottom(dif2, 'L', 'N', 'L', 'N')
const spareBoxes = spare.map((item, i) => {
  const b = box(286 + i * 112, r2Y, 108, R2H, item.name, item.ferrule || item.part, 'sp' + i)
  port(b, 'L', b.x + b.w / 2, b.y, String(i + 1))
  port(b, 'N', b.x + b.w / 2, b.y + b.h, 'N')
  return b
})
const sock = box(668, sY, 68, H, 'Розетка', 'MC116', 'sock')
const lamp = box(752, sY, 68, H, 'Свет', 'MC110', 'lamp')
;[sock, lamp].forEach((b) => { port(b, 'L', b.x + b.w / 2, b.y, 'L'); port(b, 'N', b.x + b.w / 2, b.y + b.h, 'N') })
// клеммник внизу щита, не на DIN-рейке
const klemm = box(668, sY + H + 48, 152, 36, 'Клеммы', 'низ щита')
port(klemm, 'L', klemm.x + 40, klemm.y, 'L')
port(klemm, 'N', klemm.x + 112, klemm.y, 'N')

const deye = { x: 16, y: 880, w: 700, h: 120 }
const bat = { x: 740, y: 880, w: 230, h: 120 }
const gL = { x: qG.p.outL.x, y: deye.y }, gN = { x: qG.p.outN.x, y: deye.y }
const lL = { x: 318, y: deye.y }, lN = { x: 330, y: deye.y }
const peD = { x: 660, y: deye.y + deye.h }

const viaCity = ['city']
const viaZA = ['city', 'zA']
const viaQin = ['city', 'qIn']
const viaZS = ['city', 'qIn', 'zS']
const viaQG = ['city', 'qIn', 'zS', 'qG']
const viaQL = ['qL']
const viaQ2 = ['q2']
const viaDif = ['q2', 'dif2']
const viaPzv = ['pzv']

for (let pole = 0; pole < 2; pole++) {
  const k = pole ? 'N' : 'L'
  const inn = city.p['in' + k]
  const yTop = 18 + pole * PS
  add([{ x: 2, y: yTop }, { x: inn.x, y: yTop }, inn], 'grid', pole)
  const cityRun = 'city' + pole
  const out = city.p['out' + k]
  const zin = zA.p['in' + k]
  const gap = 128 + pole * 14
  // короткий выход → Y; вся звезда в одной группе — подсветка целиком
  const tee = { x: out.x, y: out.y + 16 }
  const left = { x: out.x - 32, y: out.y + 36 }
  const right = { x: out.x + 32, y: out.y + 36 }
  add([out, tee], 'grid', pole, cityRun, viaCity)
  add([tee, left], 'grid', pole, cityRun, viaCity)
  add([tee, right], 'grid', pole, cityRun, viaCity)
  add([right, { x: gap, y: right.y }, { x: gap, y: yTop }, { x: zin.x, y: yTop }, zin], 'grid', pole, cityRun, viaCity)
  // 5×6: город вниз слева рядом с возвратом (не правый желоб, не сквозь карты)
  const cableX = 2 + pole * 6
  const ySto = sY - 40 + pole * PS
  const qInPort = qIn.p['in' + k]
  add([left, { x: cableX, y: left.y }, { x: cableX, y: ySto }, { x: qInPort.x, y: ySto }, qInPort], 'grid', pole, cityRun, viaCity)
  go(zA.p['out' + k], sA.p['i' + k], 188, 'grid', pole, undefined, viaZA)
  const split = 'split' + pole
  const qOut = qIn.p['out' + k]
  const zIn = zS.p['in' + k]
  const gxs = 128 + pole * 14
  const yq = qOut.y + 14 + pole * PS
  const yzIn = zIn.y - 20 + pole * PS
  add([qOut, { x: qOut.x, y: yq }, { x: gxs, y: yq }, { x: gxs, y: yzIn }, { x: zIn.x, y: yzIn }, zIn], 'grid', pole, split, viaQin)
  go(qOut, sS.p['i' + k], sY + 160, 'grid', pole, split, viaQin)
  const zOut = zS.p['out' + k]
  const gIn = qG.p['in' + k]
  const gxb = 256 + pole * 14
  const yz = zOut.y + 14 + pole * PS
  const yg = gIn.y - 20 + pole * PS
  add([zOut, { x: zOut.x, y: yz }, { x: gxb, y: yz }, { x: gxb, y: yg }, { x: gIn.x, y: yg }, gIn], 'grid', pole, undefined, viaZS)
  add([pole ? qG.p.outN : qG.p.outL, pole ? gN : gL], 'grid', pole, undefined, viaQG)
  const lIn = qL.p['in' + k]
  const lFrom = pole ? lN : lL
  const yLoad = sY - 18 + pole * 14
  add([lFrom, { x: lFrom.x, y: yLoad }, { x: lIn.x, y: yLoad }, lIn], 'load', pole)
  go(qL.p['out' + k], sS.p['ii' + k], sY + H + 40, 'load', pole, undefined, viaQL)
  const outG = 'sftOut' + pole
  const o = sS.p['o' + k]
  const q2in = q2.p['in' + k]
  // Y на выходе переключателя: L/N с зазором 2×PS, чтобы не налипали
  const gapLN = 2 * PS
  const oTee = { x: o.x, y: o.y - 14 - pole * 10 }
  const oLeft = { x: o.x - 36, y: o.y - 40 - pole * gapLN }
  const oRight = { x: o.x + 36, y: o.y - 40 - pole * gapLN }
  add([o, oTee], 'ret', pole, outG)
  add([oTee, oLeft], 'ret', pole, outG)
  add([oTee, oRight], 'sto', pole, outG)
  // правый луч: фаза → Y на входе розетки (правый луч Y → свет); ноль → N3
  if (pole === 0) {
    const sIn = sock.p.L
    const sTee = { x: sIn.x, y: sIn.y - 16 }
    const sArmL = { x: sIn.x - 32, y: sIn.y - 36 }
    const sArmR = { x: sIn.x + 32, y: sIn.y - 36 }
    add([oRight, { x: oRight.x, y: sArmL.y }, sArmL], 'sto', 0, outG)
    add([sIn, sTee], 'sto', 0, 'sockL', ['sock'])
    add([sTee, sArmL], 'sto', 0, outG)
    add([sTee, sArmR], 'sto', 0, outG)
    add([sArmR, { x: lamp.p.L.x, y: sArmR.y }, lamp.p.L], 'sto', 0, 'lampL', ['lamp'])
  } else {
    add([oRight, { x: oRight.x, y: klemm.y - 20 - gapLN }, { x: klemm.p.N.x, y: klemm.y - 20 - gapLN }, klemm.p.N], 'sto', 1, outG)
  }
  // 5×6 возврат: горизонталь и стояк с тем же зазором → левый луч Y
  const retX = 2 + pole * gapLN
  const qTee = { x: q2in.x, y: q2in.y - 20 }
  const qArmL = { x: q2in.x - 36, y: q2in.y - 44 - pole * 8 }
  const qArmR = { x: q2in.x + 36, y: q2in.y - 44 - pole * 8 }
  add([oLeft, { x: retX, y: oLeft.y }, { x: retX, y: qArmL.y }, qArmL], 'ret', pole, outG)
  // Y: слева из кладовки, справа на пару II переключателя
  add([q2in, qTee], 'ret', pole, outG)
  add([qTee, qArmL], 'ret', pole, outG)
  add([qTee, qArmR], 'ret', pole, outG)
  const aptII = sA.p['ii' + k]
  const midY = qArmR.y - 40 - pole * PS
  add([qArmR, { x: qArmR.x + 24, y: midY }, { x: aptII.x, y: midY }, aptII], 'ret', pole, outG)
  const q2o = q2.p['out' + k]
  const dIn = dif2.p['in' + k]
  const rise = pole ? dif2.x + dif2.w + 8 : q2.x + q2.w + 8
  const y2 = q2o.y + 12 + pole * PS
  const yIn2 = r2Y - 36 + pole * PS
  add([q2o, { x: q2o.x, y: y2 }, { x: rise, y: y2 }, { x: rise, y: yIn2 }, { x: dIn.x, y: yIn2 }, dIn], 'rail2', pole, undefined, viaQ2)
}
add([sA.p.oL, { x: sA.p.oL.x, y: 12 }, { x: pzv.p.inL.x, y: 12 }, pzv.p.inL], 'rail1', 0)
add([sA.p.oN, { x: sA.p.oN.x, y: 12 + PS }, { x: pzv.p.inN.x, y: 12 + PS }, pzv.p.inN], 'rail1', 1)

const busY = 18
const gapP = pzv.x + pzv.w + 8
add([pzv.p.outL, { x: pzv.p.outL.x, y: pzv.p.outL.y + 4 }, { x: gapP, y: pzv.p.outL.y + 4 }, { x: gapP, y: busY }, { x: heavyBoxes.at(-1).p.L.x, y: busY }], 'rail1', 0, 'r1L', viaPzv)
for (const b of heavyBoxes) add([{ x: b.p.L.x, y: busY }, b.p.L], 'rail1', 0, 'r1L', [...viaPzv, b.id])
const n1 = Y + H + 26
add([pzv.p.outN, { x: pzv.p.outN.x, y: n1 }, { x: heavyBoxes.at(-1).p.N.x, y: n1 }], 'rail1', 1, 'r1N', viaPzv)
for (const b of heavyBoxes) add([b.p.N, { x: b.p.N.x, y: n1 }], 'rail1', 1, 'r1N', [...viaPzv, b.id])

const bus2 = r2Y - 26
const gapD = dif2.x + dif2.w + 18
add([dif2.p.outL, { x: dif2.p.outL.x, y: dif2.p.outL.y + 8 }, { x: gapD, y: dif2.p.outL.y + 8 }, { x: gapD, y: bus2 }, { x: spareBoxes.at(-1).p.L.x, y: bus2 }], 'rail2', 0, 'r2L', viaDif)
for (const b of spareBoxes) add([{ x: b.p.L.x, y: bus2 }, b.p.L], 'rail2', 0, 'r2L', [...viaDif, b.id])
const n2 = r2Y + R2H + 40
const n2x = spareBoxes[0].x
const n2w = spareBoxes.at(-1).x + spareBoxes.at(-1).w - n2x
add([dif2.p.outN, { x: dif2.p.outN.x, y: n2 }, { x: spareBoxes.at(-1).p.N.x, y: n2 }], 'rail2', 1, 'r2N', viaDif)
for (const b of spareBoxes) add([b.p.N, { x: b.p.N.x, y: n2 }], 'rail2', 1, 'r2N', [...viaDif, b.id])
const n3 = klemm.y + klemm.h + 24
add([klemm.p.N, { x: klemm.p.N.x, y: n3 }], 'sto', 1, 'stoN')
add([sock.p.N, { x: sock.p.N.x, y: n3 }, { x: klemm.p.N.x, y: n3 }], 'sto', 1, 'stoN', ['sock'])
add([lamp.p.N, { x: lamp.p.N.x, y: n3 }, { x: klemm.p.N.x, y: n3 }], 'sto', 1, 'stoN', ['lamp'])
const peY = deye.y + deye.h + 100
add([peD, { x: peD.x, y: peY }, { x: 16, y: peY }], 'pe', 0)
applyHops(wires)

function paint(kind, pole, s, via) {
  if (kind === 'pe') return 'pe'
  if (!live(via)) return 'dead'
  const src = { grid: 'grid', load: 'load', rail1: s.rail1, rail2: s.rail2, ret: s.returnPair, sto: s.storageLoads }[kind]
  if (src === 'grid') return pole ? 'grid-N' : 'grid-L'
  if (src === 'load') return pole ? 'load-N' : 'load-L'
  return 'dead'
}
function wrap(text, max) {
  const out = []
  let cur = ''
  for (const word of text.replaceAll('+', '+ ').split(' ')) {
    const next = cur ? `${cur} ${word}` : word
    if (cur && next.length > max) { out.push(cur); cur = word }
    else cur = next
  }
  if (cur) out.push(cur)
  return out.slice(0, 4)
}
function posBox(g) {
  const name = g === 'storage' ? 'Кладовка' : 'Квартира'
  const btn = (v, t) => `<button data-g="${g}" data-v="${v}">${t}</button>`
  return `<div xmlns="http://www.w3.org/1999/xhtml" class="pos"><b>Переключатель<br>${name}</b><span>${btn(0, '0')}${btn(1, 'I')}${btn(2, 'II')}</span></div>`
}
function lever(b) {
  if (!b.id) return ''
  const up = on(b.id)
  const lx = b.x + b.w / 2 - 7
  const ly = b.y + Math.min(48, b.h / 2 - 18)
  return `<g class="lev" data-sw="${b.id}">
    <title>${b.title}: ${up ? 'вкл' : 'выкл'}</title>
    <rect x="${lx}" y="${ly}" width="14" height="40" rx="4" fill="#e8eaee" stroke="#555"/>
    <rect x="${lx + 2}" y="${up ? ly + 2 : ly + 22}" width="10" height="16" rx="2" fill="${up ? '#2f9b4f' : '#9aa0a6'}"/>
  </g>`
}
function card(b) {
  const name = wrap(b.title, Math.max(8, Math.floor((b.w - 14) / 5.6)))
  const ports = Object.entries(b.p).map(([, pt]) =>
    `<circle class="dot" cx="${pt.x}" cy="${pt.y}" r="6"/><text class="s" x="${pt.x}" y="${pt.y + 3}" text-anchor="middle">${pt.label}</text>`).join('')
  const knob = b.title.startsWith('Переключатель')
    ? `<foreignObject x="${b.x + 4}" y="${b.y + 28}" width="${b.w - 8}" height="70">${posBox(b.sub === 'кладовка' ? 'storage' : 'apartment')}</foreignObject>`
    : `<text class="s" x="${b.x + 7}" y="${b.y + 18 + name.length * 12}">${b.sub}</text>`
  return `<g><title>${b.title}. ${b.sub}</title>
    <rect class="card" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="7"/>
    ${name.map((line, i) => `<text class="t" x="${b.x + 7}" y="${b.y + 16 + i * 12}">${line}</text>`).join('')}
    ${knob}
    ${lever(b)}
    ${ports}</g>`
}
const NAME = { grid: 'город', load: 'Load', dead: 'нет' }

function draw() {
  const s = gateBreakers(energize(pos.storage, pos.apartment), on, pos.storage, pos.apartment)
  const paths = [...wires.reduce((map, w) => map.set(w.g, [...(map.get(w.g) ?? []), w]), new Map()).values()].map((parts) =>
    `<g class="run">${parts.map((w) => {
      const d = w.d
      return `<path class="hit" d="${d}"/><path class="w ${paint(w.kind, w.pole, s, w.via)}" d="${d}"/>`
    }).join('')}</g>`).join('')
  const bars = `    <rect class="barN ${paint(s.rail1 === 'grid' ? 'grid' : s.rail1 === 'load' ? 'load' : 'dead', 1, s, viaPzv)}" x="560" y="${n1}" width="900" height="8" rx="2"/>
    <text class="n" x="560" y="${n1 + 20}">N1 · ноль тяжёлых, после Диф 63 А. С N2 и N3 не соединять</text>
    <rect class="barN ${paint(s.rail2 === 'grid' ? 'grid' : s.rail2 === 'load' ? 'load' : 'dead', 1, s, viaDif)}" x="${n2x}" y="${n2}" width="${n2w}" height="8" rx="2"/>
    <text class="n" x="${n2x}" y="${n2 + 18}">N2 · ноль рейки 2, после дифа 32 А</text>
    <rect class="barN ${paint(s.storageLoads === 'grid' ? 'grid' : s.storageLoads === 'load' ? 'load' : 'dead', 1, s)}" x="668" y="${n3}" width="160" height="8" rx="2"/>
    <text class="n" x="668" y="${n3 - 8}">N3 кладовка · ноль; фаза — Y на розетке</text>
    <rect class="pebar" x="16" y="${peY}" width="1560" height="8"/>
    <text class="n" x="16" y="${peY - 6}">PE общий, на переключатели не заходит</text>`
  const frames = `<rect class="panel" x="8" y="8" width="1360" height="${Y + H + 40}" rx="10"/>
    <text class="t" x="16" y="24">Квартира · рейка 1</text>
    <rect class="panel" x="8" y="${r2Y - 16}" width="1580" height="${R2H + 76}" rx="10"/>
    <text class="t" x="16" y="${r2Y - 40}">Квартира · рейка 2</text>
    <rect class="panel" x="8" y="${sY - 28}" width="920" height="${H + 150}" rx="10"/>
    <text class="t" x="16" y="${sY - 18}">Кладовка</text>`
  const legend = `<rect class="card" x="990" y="${deye.y}" width="560" height="196" rx="8"/>
    <text class="t" x="1002" y="${deye.y + 20}">Куда садится каждая пара</text>
    <text class="s" x="1002" y="${deye.y + 40}">Коричневый — фаза города, синий — ноль города. Оранжевый — фаза Load, голубой — ноль Load.</text>
    <text class="s" x="1002" y="${deye.y + 58}">Переключатель I-0-II, оба. Верх — выход: 1 фаза и 5 ноль. Низ слева пара I, город: 2 и 6.</text>
    <text class="s" x="1002" y="${deye.y + 74}">Низ справа пара II: 4 и 8. В квартире II — возврат из кладовки.</text>
    <text class="s" x="1002" y="${deye.y + 90}">Автоматы и ЗУБР: вход сверху, выход снизу. ЗУБР сверху 1 и 2, снизу 3 и 4. Переключатель — исключение: выход сверху, два входа снизу.</text>
    <text class="s" x="1002" y="${deye.y + 106}">Город в квартирный переключатель заходит после ЗУБР.</text>
    <text class="s" x="1002" y="${deye.y + 128}">Выход кладовки: фаза → Y на входе розетки (правый луч → свет); ноль → N3; возврат → рейка 2.</text>
    <text class="s" x="1002" y="${deye.y + 144}">5×6 слева: город вниз + возврат вверх. У ввода рейки 2 Y: слева из кладовки, справа на II.</text>
    <text class="s" x="1002" y="${deye.y + 160}">N1, N2 и N3 между собой не соединять.</text>
    <text class="s" x="1002" y="${deye.y + 176}">Потолок четырёх рабочих жил — 32 А. DC-автомата 200 А на АКБ нет.</text>
    <text class="s" x="1002" y="${deye.y + 192}">GEN не используется.</text>`
  const inv = `<rect class="inv" x="${deye.x}" y="${deye.y}" width="${deye.w}" height="${deye.h}" rx="8"/>
    <text class="t" x="${deye.x + 12}" y="${deye.y + 24}">Deye SUN-6.6K-OG03LP1-EU-AM2</text>
    <text class="s" x="${deye.x + 12}" y="${deye.y + 42}">Off-grid 6,6 кВт. Выход Load 28,7 А. Grid и Load между собой не соединять.</text>
    <text class="s" x="${deye.x + 12}" y="${deye.y + 60}">GEN пустой. DC-автомат 200 А на батарею не куплен.</text>
    <text class="s" x="${gL.x - 6}" y="${deye.y + 78}">GRID</text>
    <text class="s" x="${lL.x - 6}" y="${deye.y + 78}">LOAD</text>
    <text class="s" x="${peD.x - 8}" y="${deye.y + deye.h - 8}">PE</text>
    <circle class="dot" cx="${gL.x}" cy="${gL.y}" r="6"/><circle class="dot" cx="${gN.x}" cy="${gN.y}" r="6"/>
    <circle class="dot" cx="${lL.x}" cy="${lL.y}" r="6"/><circle class="dot" cx="${lN.x}" cy="${lN.y}" r="6"/>
    <circle class="dot" cx="${peD.x}" cy="${peD.y}" r="6"/>
    <rect class="card" x="${bat.x}" y="${bat.y}" width="${bat.w}" height="${bat.h}" rx="8"/>
    <text class="t" x="${bat.x + 12}" y="${bat.y + 28}">АКБ SE-F16-C</text>
    <text class="s" x="${bat.x + 12}" y="${bat.y + 48}">16 кВт·ч · 51,2 В</text>
    <text class="s" x="${bat.x + 12}" y="${bat.y + 66}">К порту BAT инвертора.</text>
    <line x1="${deye.x + deye.w}" y1="${deye.y + 36}" x2="${bat.x}" y2="${bat.y + 36}" stroke="#c23b3b" stroke-width="2.2"/>
    <line x1="${deye.x + deye.w}" y1="${deye.y + 54}" x2="${bat.x}" y2="${bat.y + 54}" stroke="#222" stroke-width="2.2"/>
    <text class="s" x="${deye.x + deye.w + 8}" y="${deye.y + 28}">B+</text>
    <text class="s" x="${deye.x + deye.w + 8}" y="${deye.y + 70}">B−</text>`
  const pills = `<rect class="pill" x="1320" y="150" width="92" height="16" rx="8"/><text class="s" x="1328" y="162">5×6 город</text>
    <rect class="pill" x="1320" y="172" width="126" height="16" rx="8"/><text class="s" x="1328" y="184">5×6 возврат, 32 А</text>`
  const cards = [city, zA, sA, pzv, qIn, zS, qG, qL, sS, q2, dif2, sock, lamp, klemm, ...heavyBoxes, ...spareBoxes].map(card).join('')
  svg.querySelectorAll('.dyn').forEach((n) => n.remove())
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
  g.setAttribute('class', 'dyn')
  g.innerHTML = frames + paths + bars + inv + pills + legend + cards
  svg.appendChild(g)
  document.getElementById('status').textContent =
    `рейка 1: ${NAME[s.rail1]} · рейка 2: ${NAME[s.rail2]} · кладовка: ${NAME[s.storageLoads]} · возврат: ${NAME[s.returnPair]}`
  document.querySelectorAll('button').forEach((b) => b.classList.toggle('on', pos[b.dataset.g] === Number(b.dataset.v)))
}
document.addEventListener('click', (e) => {
  const lev = e.target.closest('[data-sw]')
  if (lev) {
    sw[lev.dataset.sw] = !on(lev.dataset.sw)
    draw()
    return
  }
  const b = e.target.closest('button[data-g]')
  if (!b) return
  pos[b.dataset.g] = Number(b.dataset.v)
  draw()
})
svg.addEventListener('mouseover', (e) => {
  const g = e.target.closest('.run')
  if (!g || g === g.parentNode.lastElementChild) return
  g.parentNode.appendChild(g)
})
selfCheck()
document.getElementById('badge').textContent = 'схема сходится'
draw()
</script>
</body>
</html>
